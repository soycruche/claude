<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function () {
  const contenedor = document.getElementById("agenda-contenido");

  // La agenda se edita en esta planilla de Google Sheets (una fila por
  // actividad). La página la lee cada vez que se abre, así que un cambio
  // en la planilla se ve en la web sin tocar ningún archivo.
  // Planilla: https://docs.google.com/spreadsheets/d/1oLdtQzdmme7pPJ-NBG_-6BhbpjC6SOH_eI6HRoOpJtk/edit
  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/1oLdtQzdmme7pPJ-NBG_-6BhbpjC6SOH_eI6HRoOpJtk/export?format=csv&gid=280225905";

  // Un color distinto por categoría, dentro de la misma paleta/tonalidad.
  // El orden es el orden en que cada categoría aparece por primera vez en
  // la planilla.
  const CATEGORY_COLORS = [
    "#F8991B", // Espacio Central Terminal 39
    "#48B9E3", // Visitas guiadas, Caminatas y recorridos
    "#005BAA", // Diseño y Decoración
    "#E6C420", // Infancias
    "#7A8B3C", // Arte y Cultura
    "#3C8577", // Recreación y Bienestar
    "#7A4870", // Música y Teatros
    "#9C3F55", // Chaca y Vino
    "#EA3524", // Espacios Gastronómicos
    "#B97A2B", // Cafés
  ];

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    });
    children.forEach((c) => c && node.appendChild(c));
    return node;
  }

  function normalizarHandle(handle) {
    return handle.replace(/^@/, "");
  }

  function renderRedes(redes) {
    if (!redes || !redes.length) return null;
    const wrap = el("div", { class: "actividad__redes" });
    redes.forEach((r) => {
      const a = el("a", {
        href: "https://instagram.com/" + normalizarHandle(r),
        target: "_blank",
        rel: "noopener noreferrer",
        text: r.startsWith("@") ? r : "@" + r,
      });
      wrap.appendChild(a);
    });
    return wrap;
  }

  function renderDescripcion(desc) {
    if (!desc) return null;
    const wrap = el("div", { class: "actividad__descripcion" });
    const parrafos = Array.isArray(desc) ? desc : [desc];
    parrafos.forEach((p) => wrap.appendChild(el("p", { text: p })));
    return wrap;
  }

  // Link a Google Maps: usa el que se cargó a mano (maps_url) si existe,
  // si no arma una búsqueda a partir de la dirección (lugar).
  function mapsHref(obj) {
    if (obj.mapsUrl) return obj.mapsUrl;
    if (!obj.lugar) return null;
    const query = obj.lugar + ", Chacarita, CABA";
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
  }

  // Si el texto de inscripción trae un link pegado (ej. a un Google Form),
  // lo reemplaza por la palabra "formulario" clickeable; deja el resto del
  // texto tal cual.
  function renderInscripcion(texto) {
    const re = /(https?:\/\/\S+)/g;
    const partes = texto.split(re);
    if (partes.length === 1) return [document.createTextNode(texto)];
    return partes.map((parte, i) =>
      i % 2 === 1
        ? el("a", { href: parte, target: "_blank", rel: "noopener noreferrer", class: "actividad__maps", text: "formulario" })
        : document.createTextNode(parte)
    );
  }

  function renderCampos(obj, incluirTitulo) {
    const wrap = el("div", { class: "actividad" });
    if (incluirTitulo && obj.titulo) {
      wrap.appendChild(el("p", { class: "actividad__titulo", text: obj.titulo }));
    }
    const desc = renderDescripcion(obj.descripcion);
    if (desc) wrap.appendChild(desc);
    if (obj.inscripcion) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Inscripción: " }), ...renderInscripcion(obj.inscripcion)]));
    }
    if (obj.lugar) {
      const href = mapsHref(obj);
      wrap.appendChild(el("div", { class: "actividad__campo" }, [
        el("strong", { text: "Lugar: " }),
        document.createTextNode(obj.lugar),
        href
          ? el("a", { href, target: "_blank", rel: "noopener noreferrer", class: "actividad__maps", text: "ver mapa" })
          : null,
      ]));
    }
    const redes = renderRedes(obj.redes);
    if (redes) wrap.appendChild(redes);
    return wrap;
  }

  // Una franja por hora del festival, de 14 a 21. Cada actividad va en la
  // franja de la hora en que empieza.
  const PRIMERA_HORA = 14;
  const ULTIMA_HORA = 21;
  const COLOR_FRANJA = "#595959";

  // En la vista por horario cada item trae su categoría y su color; en la
  // vista por categoría hereda el color del desplegable que lo contiene.
  function renderItem(item) {
    const details = el("details", { class: "item" });
    if (item.color) {
      details.style.setProperty("--accent", item.color);
      details.style.setProperty("--accent-10", hexToRgba(item.color, 0.1));
    }
    const horario = horarioRepresentativo(item);
    const linea2 = el("span", { class: "item__linea2" }, [
      horario ? el("span", { class: "item__horario", text: horario }) : null,
      item.subtitulo ? el("span", { class: "item__subtitulo", text: item.subtitulo }) : null,
    ]);
    const tituloWrap = el("span", { class: "item__titulo-wrap" }, [
      item.categorias ? el("span", { class: "item__categoria", text: item.categorias.join(" · ") }) : null,
      el("span", { class: "item__titulo", text: item.titulo || "" }),
      linea2,
    ]);
    details.appendChild(el("summary", {}, [tituloWrap, el("span", { class: "item__toggle" })]));

    const body = el("div", { class: "item__body" });
    if (item.actividades && item.actividades.length) {
      item.actividades.forEach((act) => body.appendChild(renderCampos(act, true)));
    } else {
      body.appendChild(renderCampos(item, false));
    }
    details.appendChild(body);
    return details;
  }

  // Saca la primera hora que aparece en un texto de horario libre
  // ("16 a 18 hs.", "Desde las 14 hs.", "15.30 a 16.30 hs.") y la
  // convierte a minutos desde la medianoche, para poder ordenar.
  function horarioAMinutos(h) {
    if (!h) return null;
    const m = h.match(/(\d{1,2})[.:]?(\d{2})?/);
    if (!m) return null;
    const hh = parseInt(m[1], 10);
    const mm = m[2] ? parseInt(m[2], 10) : 0;
    if (hh > 23 || mm > 59) return null;
    return hh * 60 + mm;
  }

  // El horario "representativo" de un item: el suyo propio si lo tiene,
  // o el más temprano entre sus actividades si es un item agrupado.
  function horarioRepresentativo(item) {
    if (item.horario) return item.horario;
    if (item.actividades && item.actividades.length) {
      const conHorario = item.actividades.filter((a) => a.horario);
      if (!conHorario.length) return "";
      conHorario.sort(
        (a, b) => (horarioAMinutos(a.horario) ?? Infinity) - (horarioAMinutos(b.horario) ?? Infinity)
      );
      return conHorario[0].horario;
    }
    return "";
  }

  // Convierte las filas planas de la planilla (una fila por actividad) en
  // la misma forma que usa el resto del código: categorías con items, y
  // cada item con sus actividades (o sus campos directos si es uno solo).
  function agruparFilas(filas) {
    const categorias = [];
    const indiceCategorias = new Map();
    const indiceItems = new Map();

    filas.forEach((fila) => {
      const nombreCategoria = (fila.categoria || "").trim();
      if (!nombreCategoria) return;

      let categoria = indiceCategorias.get(nombreCategoria);
      if (!categoria) {
        categoria = { nombre: nombreCategoria, items: [] };
        indiceCategorias.set(nombreCategoria, categoria);
        categorias.push(categoria);
      }

      const tituloItem = (fila.item || "").trim();
      const subtitulo = (fila.item_subtitulo || "").trim();
      // Filas del mismo lugar sin título de actividad pero con subtítulos
      // distintos son propuestas distintas (ej.: una exposición a las 20 y
      // una charla a las 21.30): van como items separados.
      const claveItem = nombreCategoria + "|" + tituloItem +
        ((fila.actividad_titulo || "").trim() ? "" : "|" + subtitulo);
      let item = indiceItems.get(claveItem);
      if (!item) {
        item = { titulo: tituloItem, subtitulo: subtitulo || undefined, _actividades: [] };
        indiceItems.set(claveItem, item);
        categoria.items.push(item);
      }

      const descripcionTexto = (fila.descripcion || "").trim();
      item._actividades.push({
        titulo: (fila.actividad_titulo || "").trim(),
        horario: (fila.horario || "").trim(),
        lugar: (fila.lugar || "").trim(),
        inscripcion: (fila.inscripcion || "").trim(),
        descripcion: descripcionTexto
          ? descripcionTexto.split(/\r?\n/).map((p) => p.trim()).filter(Boolean)
          : "",
        redes: (fila.redes || "").split(/[,\s]+/).map((r) => r.trim()).filter(Boolean),
        mapsUrl: (fila.maps_url || "").trim(),
      });
    });

    categorias.forEach((categoria) => {
      categoria.items.forEach((item) => {
        if (item._actividades.length === 1 && !item._actividades[0].titulo) {
          const { titulo, ...resto } = item._actividades[0];
          Object.assign(item, resto);
        } else {
          item.actividades = item._actividades;
        }
        delete item._actividades;
      });

      // Ordena los items de la categoría por horario (los que no tienen
      // horario quedan al final, en el orden en que aparecen en la planilla).
      categoria.items.sort((a, b) => {
        const ma = horarioAMinutos(horarioRepresentativo(a));
        const mb = horarioAMinutos(horarioRepresentativo(b));
        if (ma === null && mb === null) return 0;
        if (ma === null) return 1;
        if (mb === null) return -1;
        return ma - mb;
      });
    });

    return categorias;
  }

  // Horas de inicio (en minutos) de un horario libre. Las horas que vienen
  // después de "A" o "HASTA" son de cierre, no de inicio: "16.00 A 18.00 HS"
  // empieza a las 16; "14.00 16.00 y 18.00 HS" empieza a las 14, 16 y 18.
  // "todoElDia" marca horarios sin inicio que igual están abiertos desde que
  // arranca el festival ("HASTA 20 HS", "TODO EL DIA").
  function inicios(horario) {
    const t = (horario || "").toUpperCase();
    const re = /(HASTA(?:\s+LAS)?\s+|\bA\s+)?(\d{1,2})(?:[.:](\d{2}))?/g;
    const out = [];
    const cierres = [];
    let m;
    while ((m = re.exec(t))) {
      const hh = parseInt(m[2], 10);
      const mm = m[3] ? parseInt(m[3], 10) : 0;
      if (hh > 23 || mm > 59) continue;
      (m[1] ? cierres : out).push(hh * 60 + mm);
    }
    return { inicios: out, cierres, todoElDia: /HASTA|TODO EL D[IÍ]A|\b24\s*HS/.test(t) };
  }

  // Está abierta toda la tarde si lo dice el horario, si no tiene hora de
  // inicio pero sí de cierre ("HASTA 20 HS"), o si abre a las 14 (o antes)
  // y cierra a las 19 o más tarde ("14 A 19.00 HS").
  const CIERRE_TODO_EL_DIA = 19 * 60;

  function esTodoElDia(horario) {
    const t = (horario || "").toUpperCase();
    if (/TODO EL D[IÍ]A|\b24\s*HS/.test(t)) return true;
    const r = inicios(horario);
    if (!r.inicios.length) return r.todoElDia;
    return Math.min(...r.inicios) <= PRIMERA_HORA * 60 &&
      r.cierres.length > 0 && Math.max(...r.cierres) >= CIERRE_TODO_EL_DIA;
  }

  function normalizar(texto) {
    return (texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/["“”]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function nombreFranja(hora) {
    return String(hora).padStart(2, "0") + ".00 HS";
  }

  // Reparte los items de todas las categorías en franjas horarias. Lo que ya
  // está abierto a las 14 (o empieza antes) va en la primera franja; lo que
  // empieza a las 21 o más tarde, en la última. Si un mismo lugar figura en
  // varias categorías, aparece una sola vez por franja.
  function armarFranjas(categorias, colorDe) {
    const franjas = [];
    for (let h = PRIMERA_HORA; h <= ULTIMA_HORA; h++) {
      franjas.push({ nombre: nombreFranja(h), color: COLOR_FRANJA, items: [], claves: new Map() });
    }
    const aConfirmar = { nombre: "Horario a confirmar", color: COLOR_FRANJA, items: [], claves: new Map() };
    const todoElDia = { nombre: "14 a 20 hs. Horario de corrido", color: COLOR_FRANJA, items: [], claves: new Map() };

    categorias.forEach((categoria, ordenCategoria) => {
      const color = colorDe(categoria);
      categoria.items.forEach((item) => {
        const horarios = item.actividades ? item.actividades.map((a) => a.horario) : [item.horario];
        // Lo que está abierto toda la tarde va en su propia pestaña; si además
        // tiene actividades con hora puntual, esas siguen en su franja.
        let minutos = [];
        let abiertoTodoElDia = false;
        horarios.forEach((h) => {
          if (esTodoElDia(h)) abiertoTodoElDia = true;
          else minutos = minutos.concat(inicios(h).inicios);
        });

        const destinos = new Map();
        if (abiertoTodoElDia) destinos.set(todoElDia, 0);
        minutos.forEach((min) => {
          const hora = Math.min(Math.max(Math.floor(min / 60), PRIMERA_HORA), ULTIMA_HORA);
          const franja = franjas[hora - PRIMERA_HORA];
          const orden = Math.max(min, PRIMERA_HORA * 60);
          if (!destinos.has(franja) || orden < destinos.get(franja)) destinos.set(franja, orden);
        });
        if (!destinos.size) destinos.set(aConfirmar, 0);

        destinos.forEach((orden, franja) => {
          const clave = normalizar(item.titulo);
          const existente = franja.claves.get(clave);
          if (existente) {
            if (!existente.categorias.includes(categoria.nombre)) existente.categorias.push(categoria.nombre);
            return;
          }
          const entrada = Object.assign({}, item, { categorias: [categoria.nombre], color, orden, ordenCategoria });
          franja.claves.set(clave, entrada);
          franja.items.push(entrada);
        });
      });
    });

    const todas = [todoElDia].concat(franjas, [aConfirmar]).filter((f) => f.items.length);
    // Dentro de cada pestaña: agrupado por categoría (en el orden de la
    // planilla) y, dentro de cada categoría, por hora de inicio.
    todas.forEach((f) => {
      f.items.sort((a, b) => a.ordenCategoria - b.ordenCategoria || a.orden - b.orden ||
        a.titulo.localeCompare(b.titulo, "es"));
    });
    return todas;
  }

  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.replace("#", ""), 16);
    const r = (n >> 16) & 255;
    const g = (n >> 8) & 255;
    const b = n & 255;
    return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
  }

  function renderFranja(franja) {
    const details = el("details", { class: "categoria" });
    details.style.setProperty("--accent", franja.color);
    details.style.setProperty("--accent-10", hexToRgba(franja.color, 0.1));
    const tituloWrap = el("span", { class: "categoria__titulo-wrap" }, [
      el("span", { text: franja.nombre }),
    ]);
    const meta = el("span", { class: "categoria__meta" }, [
      el("span", { class: "categoria__chevron" }),
    ]);
    details.appendChild(el("summary", {}, [tituloWrap, meta]));

    const body = el("div", { class: "categoria__body" });
    franja.items.forEach((it) => body.appendChild(renderItem(it)));
    details.appendChild(body);
    return details;
  }

  function renderCategoria(categoria, color) {
    const details = el("details", { class: "categoria" });
    details.style.setProperty("--accent", color);
    details.style.setProperty("--accent-10", hexToRgba(color, 0.1));
    const tituloWrap = el("span", { class: "categoria__titulo-wrap" }, [
      el("span", { text: categoria.nombre }),
    ]);
    const meta = el("span", { class: "categoria__meta" }, [
      el("span", { class: "categoria__chevron" }),
    ]);
    details.appendChild(el("summary", {}, [tituloWrap, meta]));

    const body = el("div", { class: "categoria__body" });
    if (!categoria.items.length) {
      body.appendChild(el("p", { class: "categoria__vacio", text: "Próximamente." }));
    } else {
      categoria.items.forEach((it) => body.appendChild(renderItem(it)));
    }
    details.appendChild(body);
    return details;
  }

  // La vista elegida queda en la dirección (#categorias), así un link
  // compartido abre directamente en esa vista.
  const botonesVista = document.querySelectorAll(".agenda__vista button");

  function vistaActual() {
    return location.hash === "#categorias" ? "categorias" : "horario";
  }

  // En la vista por horario, estas categorías no van en las franjas sino
  // abajo, como desplegables por categoría (se comparan sin tildes ni comillas).
  // Espacio Central va primero, tal cual como en la vista por categoría.
  const CATEGORIAS_ARRIBA = ["espacio central"];
  const CATEGORIAS_APARTE = ["gastronom", "cafe", "chaca y vino"];

  function coincide(categoria, claves) {
    const nombre = normalizar(categoria.nombre);
    return claves.some((clave) => nombre.includes(clave));
  }

  const vaArriba = (categoria) => coincide(categoria, CATEGORIAS_ARRIBA);
  const vaAparte = (categoria) => coincide(categoria, CATEGORIAS_APARTE);

  function renderAgenda(categorias) {
    const vista = vistaActual();
    botonesVista.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vista === vista)));

    // El color de cada categoría sale de su orden en la planilla, igual en las dos vistas.
    const colores = new Map(categorias.map((c, i) => [c, CATEGORY_COLORS[i % CATEGORY_COLORS.length]]));
    const colorDe = (categoria) => colores.get(categoria);

    contenedor.innerHTML = "";
    if (vista === "categorias") {
      categorias.forEach((categoria) => contenedor.appendChild(renderCategoria(categoria, colorDe(categoria))));
    } else {
      categorias.filter(vaArriba)
        .forEach((categoria) => contenedor.appendChild(renderCategoria(categoria, colorDe(categoria))));
      armarFranjas(categorias.filter((c) => !vaArriba(c) && !vaAparte(c)), colorDe)
        .forEach((franja) => contenedor.appendChild(renderFranja(franja)));
      categorias.filter(vaAparte)
        .forEach((categoria) => contenedor.appendChild(renderCategoria(categoria, colorDe(categoria))));
    }

    // Al abrir un desplegable, cierra los demás.
    const desplegables = contenedor.querySelectorAll(".categoria");
    desplegables.forEach((d) => {
      d.addEventListener("toggle", () => {
        if (!d.open) return;
        desplegables.forEach((otro) => {
          if (otro !== d) otro.open = false;
        });
      });
    });
  }

  let categoriasCargadas = null;

  botonesVista.forEach((b) => {
    b.addEventListener("click", () => {
      history.replaceState(null, "", b.dataset.vista === "categorias" ? "#categorias" : location.pathname + location.search);
      if (categoriasCargadas) renderAgenda(categoriasCargadas);
    });
  });

  contenedor.innerHTML = '<p class="categoria__vacio">Cargando agenda…</p>';

  fetch(SHEET_CSV_URL)
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then((csv) => {
      const resultado = Papa.parse(csv, { header: true, skipEmptyLines: true });
      categoriasCargadas = agruparFilas(resultado.data);
      renderAgenda(categoriasCargadas);
    })
    .catch((err) => {
      console.error("No se pudo cargar la agenda desde Sheets:", err);
      contenedor.innerHTML =
        '<p class="categoria__vacio">No se pudo cargar la agenda en este momento. Probá recargar la página en un rato.</p>';
    });
})();
</script>
