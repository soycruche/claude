<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de actividades — Te conozco Chacarita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --amarillo: #EACD59;
    --azul: #0F57A7;
    --rojo: #D74431;
    --crema: #FBF5E4;
    --papel: #FFFFFF;
    --texto: #221A10;
    --texto-suave: #6b5f4e;
    --borde: #ecdfc3;
    --pendiente-bg: #fff3df;
    --pendiente-borde: #e4b566;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--crema);
    color: var(--texto);
    font-family: 'Oswald', Arial, sans-serif;
    line-height: 1.5;
  }

  .hero {
    background: var(--amarillo);
    color: #fff;
    text-align: center;
    padding: 48px 20px 40px;
  }

  .hero__te-conozco {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.12em;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    margin: 0;
  }

  .hero__chacarita {
    font-family: 'Yellowtail', cursive;
    font-size: clamp(3rem, 12vw, 5rem);
    line-height: 1;
    margin: 0 0 18px;
  }

  .hero__fecha {
    font-weight: 700;
    letter-spacing: 0.06em;
    font-size: clamp(1.4rem, 5vw, 2rem);
    margin: 0;
  }

  .hero__lugar {
    font-weight: 500;
    letter-spacing: 0.08em;
    font-size: clamp(0.95rem, 3vw, 1.2rem);
    margin: 4px 0 0;
    opacity: 0.92;
  }

  .agenda {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }

  .agenda__header {
    text-align: center;
    margin-bottom: 24px;
  }

  .agenda__header h2 {
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    color: var(--texto);
    margin: 0 0 6px;
  }

  .agenda__header p {
    margin: 0;
    color: var(--texto-suave);
    font-weight: 400;
  }

  /* ---- Categoría (nivel 1) ---- */
  .categoria {
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(34, 26, 16, 0.08);
  }

  .categoria > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 1.02rem;
    color: #fff;
  }

  .categoria > summary::-webkit-details-marker { display: none; }

  .categoria--amarillo > summary { background: var(--amarillo); }
  .categoria--azul > summary { background: var(--azul); }
  .categoria--rojo > summary { background: var(--rojo); }

  .categoria__titulo-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .categoria__nota {
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    font-size: 0.78rem;
    opacity: 0.9;
  }

  .categoria__meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .categoria__count {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  .categoria__chevron {
    width: 11px;
    height: 11px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(45deg);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .categoria[open] > summary .categoria__chevron {
    transform: rotate(-135deg);
  }

  .categoria__body {
    background: var(--papel);
    padding: 14px 16px 18px;
  }

  .categoria__vacio {
    color: var(--texto-suave);
    font-style: italic;
    font-weight: 300;
    padding: 6px 4px;
  }

  /* ---- Item (nivel 2, el "+") ---- */
  .item {
    border: 1px solid var(--borde);
    border-radius: 10px;
    margin-bottom: 10px;
    background: var(--crema);
  }

  .item > summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .item > summary::-webkit-details-marker { display: none; }

  .item__titulo-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .item__titulo {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto);
  }

  .item__subtitulo {
    font-weight: 400;
    font-size: 0.8rem;
    color: var(--texto-suave);
  }

  .item__toggle {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: var(--rojo);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    line-height: 1;
  }

  .item[open] > summary .item__toggle::before { content: "–"; }
  .item__toggle::before { content: "+"; }

  .item__body {
    padding: 2px 16px 16px;
    font-family: Arial, sans-serif;
  }

  /* ---- Actividad (dentro del item, sin acordeón propio) ---- */
  .actividad {
    padding: 12px 0;
    border-top: 1px dashed var(--borde);
  }

  .actividad:first-child {
    border-top: none;
    padding-top: 4px;
  }

  .actividad__titulo {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto);
    margin: 0 0 4px;
  }

  .actividad__campo {
    margin: 4px 0;
    font-size: 0.88rem;
  }

  .actividad__campo strong {
    color: var(--texto);
    font-weight: 700;
  }

  .actividad__descripcion p {
    margin: 4px 0;
    font-size: 0.88rem;
  }

  .actividad__redes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 0;
  }

  .actividad__redes a {
    color: var(--azul);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .actividad__redes a:hover { text-decoration: underline; }

  .actividad__pendientes {
    margin-top: 8px;
    background: var(--pendiente-bg);
    border: 1px solid var(--pendiente-borde);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
  }

  .actividad__pendientes div {
    font-weight: 700;
    margin-bottom: 4px;
  }

  .actividad__pendientes ul {
    margin: 0;
    padding-left: 18px;
  }
</style>
</head>
<body>

<div class="hero">
  <p class="hero__te-conozco">TE CONOZCO</p>
  <p class="hero__chacarita">Chacarita</p>
  <p class="hero__fecha">14 DE NOVIEMBRE</p>
  <p class="hero__lugar">CHACARITA · CABA</p>
</div>

<section class="agenda" id="agenda">
  <header class="agenda__header">
    <h2>Agenda de actividades</h2>
    <p>Tocá cada categoría y cada actividad para ver el detalle.</p>
  </header>
  <div id="agenda-contenido"></div>
</section>

<script src="agenda-data.js"></script>
<script>
(function () {
  const contenedor = document.getElementById("agenda-contenido");
  const COLORES = ["amarillo", "azul", "rojo"];

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    });
    children.forEach((c) => c && node.appendChild(c));
    return node;
  }

  function normalizarHandle(handle) {
    return handle.replace(/^@/, "");
  }

  function renderRedes(redes) {
    if (!redes || !redes.length) return null;
    const wrap = el("div", { class: "actividad__redes" });
    redes.forEach((r) => {
      const a = el("a", {
        href: "https://instagram.com/" + normalizarHandle(r),
        target: "_blank",
        rel: "noopener noreferrer",
        text: r.startsWith("@") ? r : "@" + r,
      });
      wrap.appendChild(a);
    });
    return wrap;
  }

  function renderDescripcion(desc) {
    if (!desc) return null;
    const wrap = el("div", { class: "actividad__descripcion" });
    const parrafos = Array.isArray(desc) ? desc : [desc];
    parrafos.forEach((p) => wrap.appendChild(el("p", { text: p })));
    return wrap;
  }

  function renderPendientes(pendientes) {
    if (!pendientes || !pendientes.length) return null;
    const wrap = el("div", { class: "actividad__pendientes" });
    wrap.appendChild(el("div", { text: "⚠ Pendiente de definir" }));
    const ul = el("ul");
    pendientes.forEach((p) => ul.appendChild(el("li", { text: p })));
    wrap.appendChild(ul);
    return wrap;
  }

  function renderActividad(act) {
    const wrap = el("div", { class: "actividad" });
    wrap.appendChild(el("p", { class: "actividad__titulo", text: act.titulo || "" }));
    if (act.horario) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Horario: " }), document.createTextNode(act.horario)]));
    }
    if (act.lugar) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Lugar: " }), document.createTextNode(act.lugar)]));
    }
    if (act.inscripcion) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Inscripción: " }), document.createTextNode(act.inscripcion)]));
    }
    const desc = renderDescripcion(act.descripcion);
    if (desc) wrap.appendChild(desc);
    const redes = renderRedes(act.redes);
    if (redes) wrap.appendChild(redes);
    const pend = renderPendientes(act.pendientes);
    if (pend) wrap.appendChild(pend);
    return wrap;
  }

  function renderItem(item) {
    const details = el("details", { class: "item" });
    const tituloWrap = el("span", { class: "item__titulo-wrap" }, [
      el("span", { class: "item__titulo", text: item.titulo || "" }),
      item.subtitulo ? el("span", { class: "item__subtitulo", text: item.subtitulo }) : null,
    ]);
    details.appendChild(el("summary", {}, [tituloWrap, el("span", { class: "item__toggle" })]));

    const body = el("div", { class: "item__body" });
    (item.actividades || []).forEach((act) => body.appendChild(renderActividad(act)));
    details.appendChild(body);
    return details;
  }

  function contarActividades(categoria) {
    return (categoria.items || []).reduce((n, it) => n + (it.actividades || []).length, 0);
  }

  function renderCategoria(categoria, color) {
    const details = el("details", { class: "categoria categoria--" + color });
    const total = contarActividades(categoria);

    const tituloWrap = el("span", { class: "categoria__titulo-wrap" }, [
      el("span", { text: categoria.nombre }),
      categoria.nota ? el("span", { class: "categoria__nota", text: categoria.nota }) : null,
    ]);

    const meta = el("span", { class: "categoria__meta" }, [
      el("span", {
        class: "categoria__count",
        text: total === 1 ? "1 actividad" : total + " actividades",
      }),
      el("span", { class: "categoria__chevron" }),
    ]);

    details.appendChild(el("summary", {}, [tituloWrap, meta]));

    const body = el("div", { class: "categoria__body" });
    if (total === 0) {
      body.appendChild(el("p", {
        class: "categoria__vacio",
        text: "Próximamente. Sumá las actividades en agenda-data.js.",
      }));
    } else {
      categoria.items.forEach((it) => body.appendChild(renderItem(it)));
    }
    details.appendChild(body);
    return details;
  }

  (typeof AGENDA_DATA !== "undefined" ? AGENDA_DATA : []).forEach((categoria, i) => {
    contenedor.appendChild(renderCategoria(categoria, COLORES[i % COLORES.length]));
  });
})();
</script>

</body>
</html>
