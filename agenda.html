<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de actividades — Te conozco Chacarita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --texto: #121212;
    --texto-suave: #5c5c5c;
    --borde: #111111;
    --pendiente-bg: #fff3df;
    --pendiente-borde: #e4b566;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--texto);
    font-family: 'Oswald', Arial, sans-serif;
    line-height: 1.5;
  }

  .agenda {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }

  .agenda__header {
    text-align: center;
    margin-bottom: 24px;
  }

  .agenda__header h2 {
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: clamp(1.5rem, 4.5vw, 2.1rem);
    color: var(--texto);
    margin: 0 0 4px;
  }

  .agenda__marca {
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    color: var(--texto-suave);
  }

  /* ---- Categoría (nivel 1) ---- */
  .categoria {
    border: 1.5px solid var(--borde);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .categoria > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 1.02rem;
    color: #fff;
    background: var(--accent);
  }

  .categoria > summary::-webkit-details-marker { display: none; }

  .categoria__titulo-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .categoria__nota {
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    font-size: 0.78rem;
    opacity: 0.9;
  }

  .categoria__meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .categoria__count {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  .categoria__chevron {
    width: 11px;
    height: 11px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(45deg);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .categoria[open] > summary .categoria__chevron {
    transform: rotate(-135deg);
  }

  .categoria__body {
    background: #fff;
    padding: 14px 16px 18px;
  }

  .categoria__vacio {
    color: var(--texto-suave);
    font-style: italic;
    font-weight: 300;
    padding: 6px 4px;
  }

  /* ---- Item (nivel 2, el "+") ---- */
  .item {
    border: 1.5px solid var(--borde);
    border-radius: 10px;
    margin-bottom: 10px;
    background: #fff;
  }

  .item > summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .item > summary::-webkit-details-marker { display: none; }

  .item__titulo-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .item__titulo {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto);
  }

  .item__subtitulo {
    font-weight: 400;
    font-size: 0.8rem;
    color: var(--texto-suave);
  }

  .item__toggle {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    line-height: 1;
  }

  .item[open] > summary .item__toggle::before { content: "–"; }
  .item__toggle::before { content: "+"; }

  .item__body {
    padding: 2px 16px 16px;
    font-family: Arial, sans-serif;
    border-top: 1px solid #e5e5e5;
  }

  /* ---- Actividad (dentro del item, sin acordeón propio) ---- */
  .actividad {
    padding: 12px 0;
    border-top: 1px dashed #d8d8d8;
  }

  .actividad:first-child {
    border-top: none;
    padding-top: 10px;
  }

  .actividad__titulo {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--texto);
    margin: 0 0 4px;
  }

  .actividad__campo {
    margin: 4px 0;
    font-size: 0.88rem;
    color: var(--texto);
  }

  .actividad__campo strong {
    color: var(--texto);
    font-weight: 700;
  }

  .actividad__descripcion p {
    margin: 4px 0;
    font-size: 0.88rem;
    color: var(--texto);
  }

  .actividad__redes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 0;
  }

  .actividad__redes a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .actividad__redes a:hover { text-decoration: underline; }

  .actividad__pendientes {
    margin-top: 8px;
    background: var(--pendiente-bg);
    border: 1px solid var(--pendiente-borde);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
  }

  .actividad__pendientes div {
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--texto);
  }

  .actividad__pendientes ul {
    margin: 0;
    padding-left: 18px;
    color: var(--texto);
  }
</style>
</head>
<body>

<section class="agenda" id="agenda">
  <header class="agenda__header">
    <h2>Agenda de actividades</h2>
    <p class="agenda__marca">Te conozco Chacarita</p>
  </header>
  <div id="agenda-contenido"></div>
</section>

<script src="agenda-data.js"></script>
<script>
(function () {
  const contenedor = document.getElementById("agenda-contenido");

  // Un color distinto por categoría, dentro de la misma paleta/tonalidad.
  const CATEGORY_COLORS = [
    "#EACD59", // Visitas guiadas, Caminatas y recorridos — mostaza
    "#D74431", // Diseño y Decoración — terracota
    "#0F57A7", // Infancias — azul
    "#D9722E", // Arte y Cultura — naranja quemado
    "#7A8B3C", // Recreación — verde oliva
    "#3C8577", // Música — verde azulado
    "#7A4870", // Teatros — ciruela
    "#9C3F55", // Chaca y Vino — vino
    "#70472B", // Espacios Gastronómicos — marrón tierra
    "#1B3A5C", // Cafés — azul petróleo
  ];

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    });
    children.forEach((c) => c && node.appendChild(c));
    return node;
  }

  function normalizarHandle(handle) {
    return handle.replace(/^@/, "");
  }

  function renderRedes(redes) {
    if (!redes || !redes.length) return null;
    const wrap = el("div", { class: "actividad__redes" });
    redes.forEach((r) => {
      const a = el("a", {
        href: "https://instagram.com/" + normalizarHandle(r),
        target: "_blank",
        rel: "noopener noreferrer",
        text: r.startsWith("@") ? r : "@" + r,
      });
      wrap.appendChild(a);
    });
    return wrap;
  }

  function renderDescripcion(desc) {
    if (!desc) return null;
    const wrap = el("div", { class: "actividad__descripcion" });
    const parrafos = Array.isArray(desc) ? desc : [desc];
    parrafos.forEach((p) => wrap.appendChild(el("p", { text: p })));
    return wrap;
  }

  function renderPendientes(pendientes) {
    if (!pendientes || !pendientes.length) return null;
    const wrap = el("div", { class: "actividad__pendientes" });
    wrap.appendChild(el("div", { text: "⚠ Pendiente de definir" }));
    const ul = el("ul");
    pendientes.forEach((p) => ul.appendChild(el("li", { text: p })));
    wrap.appendChild(ul);
    return wrap;
  }

  function renderCampos(obj, incluirTitulo) {
    const wrap = el("div", { class: "actividad" });
    if (incluirTitulo && obj.titulo) {
      wrap.appendChild(el("p", { class: "actividad__titulo", text: obj.titulo }));
    }
    if (obj.horario) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Horario: " }), document.createTextNode(obj.horario)]));
    }
    if (obj.lugar) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Lugar: " }), document.createTextNode(obj.lugar)]));
    }
    if (obj.inscripcion) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Inscripción: " }), document.createTextNode(obj.inscripcion)]));
    }
    const desc = renderDescripcion(obj.descripcion);
    if (desc) wrap.appendChild(desc);
    const redes = renderRedes(obj.redes);
    if (redes) wrap.appendChild(redes);
    const pend = renderPendientes(obj.pendientes);
    if (pend) wrap.appendChild(pend);
    return wrap;
  }

  function renderItem(item) {
    const details = el("details", { class: "item" });
    const tituloWrap = el("span", { class: "item__titulo-wrap" }, [
      el("span", { class: "item__titulo", text: item.titulo || "" }),
      item.subtitulo ? el("span", { class: "item__subtitulo", text: item.subtitulo }) : null,
    ]);
    details.appendChild(el("summary", {}, [tituloWrap, el("span", { class: "item__toggle" })]));

    const body = el("div", { class: "item__body" });
    if (item.actividades && item.actividades.length) {
      item.actividades.forEach((act) => body.appendChild(renderCampos(act, true)));
    } else {
      body.appendChild(renderCampos(item, false));
    }
    details.appendChild(body);
    return details;
  }

  function contarItems(categoria) {
    return (categoria.items || []).length;
  }

  function renderCategoria(categoria, color) {
    const details = el("details", { class: "categoria" });
    details.style.setProperty("--accent", color);
    const total = contarItems(categoria);

    const tituloWrap = el("span", { class: "categoria__titulo-wrap" }, [
      el("span", { text: categoria.nombre }),
      categoria.nota ? el("span", { class: "categoria__nota", text: categoria.nota }) : null,
    ]);

    const meta = el("span", { class: "categoria__meta" }, [
      el("span", {
        class: "categoria__count",
        text: total === 1 ? "1 actividad" : total + " actividades",
      }),
      el("span", { class: "categoria__chevron" }),
    ]);

    details.appendChild(el("summary", {}, [tituloWrap, meta]));

    const body = el("div", { class: "categoria__body" });
    if (total === 0) {
      body.appendChild(el("p", {
        class: "categoria__vacio",
        text: "Próximamente. Sumá las actividades en agenda-data.js.",
      }));
    } else {
      categoria.items.forEach((it) => body.appendChild(renderItem(it)));
    }
    details.appendChild(body);
    return details;
  }

  (typeof AGENDA_DATA !== "undefined" ? AGENDA_DATA : []).forEach((categoria, i) => {
    contenedor.appendChild(renderCategoria(categoria, CATEGORY_COLORS[i % CATEGORY_COLORS.length]));
  });
})();
</script>

</body>
</html>
