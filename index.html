<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function () {
  const contenedor = document.getElementById("agenda-contenido");

  // La agenda se edita en esta planilla de Google Sheets (una fila por
  // actividad). La página la lee cada vez que se abre, así que un cambio
  // en la planilla se ve en la web sin tocar ningún archivo.
  // Planilla: https://docs.google.com/spreadsheets/d/1oLdtQzdmme7pPJ-NBG_-6BhbpjC6SOH_eI6HRoOpJtk/edit
  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/1oLdtQzdmme7pPJ-NBG_-6BhbpjC6SOH_eI6HRoOpJtk/export?format=csv&gid=280225905";

  // Un color distinto por categoría, dentro de la misma paleta/tonalidad.
  // El orden es el orden en que cada categoría aparece por primera vez en
  // la planilla.
  const CATEGORY_COLORS = [
    "#F8991B", // Espacio Central Terminal 39
    "#48B9E3", // Visitas guiadas, Caminatas y recorridos
    "#005BAA", // Diseño y Decoración
    "#E6C420", // Infancias
    "#7A8B3C", // Arte y Cultura
    "#3C8577", // Recreación y Bienestar
    "#7A4870", // Música y Teatros
    "#9C3F55", // Chaca y Vino
    "#EA3524", // Espacios Gastronómicos
    "#B97A2B", // Cafés
  ];

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    });
    children.forEach((c) => c && node.appendChild(c));
    return node;
  }

  function normalizarHandle(handle) {
    return handle.replace(/^@/, "");
  }

  function renderRedes(redes) {
    if (!redes || !redes.length) return null;
    const wrap = el("div", { class: "actividad__redes" });
    redes.forEach((r) => {
      const a = el("a", {
        href: "https://instagram.com/" + normalizarHandle(r),
        target: "_blank",
        rel: "noopener noreferrer",
        text: r.startsWith("@") ? r : "@" + r,
      });
      wrap.appendChild(a);
    });
    return wrap;
  }

  function renderDescripcion(desc) {
    if (!desc) return null;
    const wrap = el("div", { class: "actividad__descripcion" });
    const parrafos = Array.isArray(desc) ? desc : [desc];
    parrafos.forEach((p) => wrap.appendChild(el("p", { text: p })));
    return wrap;
  }

  // Link a Google Maps: usa el que se cargó a mano (maps_url) si existe,
  // si no arma una búsqueda a partir de la dirección (lugar).
  function mapsHref(obj) {
    if (obj.mapsUrl) return obj.mapsUrl;
    if (!obj.lugar) return null;
    const query = obj.lugar + ", Chacarita, CABA";
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
  }

  // Si el texto de inscripción trae un link pegado (ej. a un Google Form),
  // lo reemplaza por la palabra "formulario" clickeable; deja el resto del
  // texto tal cual.
  function renderInscripcion(texto) {
    const re = /(https?:\/\/\S+)/g;
    const partes = texto.split(re);
    if (partes.length === 1) return [document.createTextNode(texto)];
    return partes.map((parte, i) =>
      i % 2 === 1
        ? el("a", { href: parte, target: "_blank", rel: "noopener noreferrer", class: "actividad__maps", text: "formulario" })
        : document.createTextNode(parte)
    );
  }

  function renderCampos(obj, incluirTitulo) {
    const wrap = el("div", { class: "actividad" });
    if (incluirTitulo && obj.titulo) {
      wrap.appendChild(el("p", { class: "actividad__titulo", text: obj.titulo }));
    }
    const desc = renderDescripcion(obj.descripcion);
    if (desc) wrap.appendChild(desc);
    if (obj.inscripcion) {
      wrap.appendChild(el("div", { class: "actividad__campo" },
        [el("strong", { text: "Inscripción: " }), ...renderInscripcion(obj.inscripcion)]));
    }
    if (obj.lugar) {
      const href = mapsHref(obj);
      wrap.appendChild(el("div", { class: "actividad__campo" }, [
        el("strong", { text: "Lugar: " }),
        document.createTextNode(obj.lugar),
        href
          ? el("a", { href, target: "_blank", rel: "noopener noreferrer", class: "actividad__maps", text: "ver mapa" })
          : null,
      ]));
    }
    const redes = renderRedes(obj.redes);
    if (redes) wrap.appendChild(redes);
    return wrap;
  }

  function renderItem(item) {
    const details = el("details", { class: "item" });
    const horario = horarioRepresentativo(item);
    const linea2 = el("span", { class: "item__linea2" }, [
      horario ? el("span", { class: "item__horario", text: horario }) : null,
      item.subtitulo ? el("span", { class: "item__subtitulo", text: item.subtitulo }) : null,
    ]);
    const tituloWrap = el("span", { class: "item__titulo-wrap" }, [
      el("span", { class: "item__titulo", text: item.titulo || "" }),
      linea2,
    ]);
    details.appendChild(el("summary", {}, [tituloWrap, el("span", { class: "item__toggle" })]));

    const body = el("div", { class: "item__body" });
    if (item.actividades && item.actividades.length) {
      item.actividades.forEach((act) => body.appendChild(renderCampos(act, true)));
    } else {
      body.appendChild(renderCampos(item, false));
    }
    details.appendChild(body);
    return details;
  }

  function contarItems(categoria) {
    return (categoria.items || []).length;
  }

  // Saca la primera hora que aparece en un texto de horario libre
  // ("16 a 18 hs.", "Desde las 14 hs.", "15.30 a 16.30 hs.") y la
  // convierte a minutos desde la medianoche, para poder ordenar.
  function horarioAMinutos(h) {
    if (!h) return null;
    const m = h.match(/(\d{1,2})[.:]?(\d{2})?/);
    if (!m) return null;
    const hh = parseInt(m[1], 10);
    const mm = m[2] ? parseInt(m[2], 10) : 0;
    if (hh > 23 || mm > 59) return null;
    return hh * 60 + mm;
  }

  // El horario "representativo" de un item: el suyo propio si lo tiene,
  // o el más temprano entre sus actividades si es un item agrupado.
  function horarioRepresentativo(item) {
    if (item.horario) return item.horario;
    if (item.actividades && item.actividades.length) {
      const conHorario = item.actividades.filter((a) => a.horario);
      if (!conHorario.length) return "";
      conHorario.sort(
        (a, b) => (horarioAMinutos(a.horario) ?? Infinity) - (horarioAMinutos(b.horario) ?? Infinity)
      );
      return conHorario[0].horario;
    }
    return "";
  }

  // Convierte las filas planas de la planilla (una fila por actividad) en
  // la misma forma que usa el resto del código: categorías con items, y
  // cada item con sus actividades (o sus campos directos si es uno solo).
  function agruparFilas(filas) {
    const categorias = [];
    const indiceCategorias = new Map();
    const indiceItems = new Map();

    filas.forEach((fila) => {
      const nombreCategoria = (fila.categoria || "").trim();
      if (!nombreCategoria) return;

      let categoria = indiceCategorias.get(nombreCategoria);
      if (!categoria) {
        categoria = { nombre: nombreCategoria, items: [] };
        indiceCategorias.set(nombreCategoria, categoria);
        categorias.push(categoria);
      }

      const tituloItem = (fila.item || "").trim();
      const claveItem = nombreCategoria + "|" + tituloItem;
      let item = indiceItems.get(claveItem);
      if (!item) {
        const subtitulo = (fila.item_subtitulo || "").trim();
        item = { titulo: tituloItem, subtitulo: subtitulo || undefined, _actividades: [] };
        indiceItems.set(claveItem, item);
        categoria.items.push(item);
      }

      const descripcionTexto = (fila.descripcion || "").trim();
      item._actividades.push({
        titulo: (fila.actividad_titulo || "").trim(),
        horario: (fila.horario || "").trim(),
        lugar: (fila.lugar || "").trim(),
        inscripcion: (fila.inscripcion || "").trim(),
        descripcion: descripcionTexto
          ? descripcionTexto.split(/\r?\n/).map((p) => p.trim()).filter(Boolean)
          : "",
        redes: (fila.redes || "").split(",").map((r) => r.trim()).filter(Boolean),
        mapsUrl: (fila.maps_url || "").trim(),
      });
    });

    categorias.forEach((categoria) => {
      categoria.items.forEach((item) => {
        if (item._actividades.length === 1 && !item._actividades[0].titulo) {
          const { titulo, ...resto } = item._actividades[0];
          Object.assign(item, resto);
        } else {
          item.actividades = item._actividades;
        }
        delete item._actividades;
      });

      // Ordena los items de la categoría por horario (los que no tienen
      // horario quedan al final, en el orden en que aparecen en la planilla).
      categoria.items.sort((a, b) => {
        const ma = horarioAMinutos(horarioRepresentativo(a));
        const mb = horarioAMinutos(horarioRepresentativo(b));
        if (ma === null && mb === null) return 0;
        if (ma === null) return 1;
        if (mb === null) return -1;
        return ma - mb;
      });
    });

    return categorias;
  }

  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.replace("#", ""), 16);
    const r = (n >> 16) & 255;
    const g = (n >> 8) & 255;
    const b = n & 255;
    return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
  }

  function renderCategoria(categoria, color) {
    const details = el("details", { class: "categoria" });
    details.style.setProperty("--accent", color);
    details.style.setProperty("--accent-10", hexToRgba(color, 0.1));
    const total = contarItems(categoria);

    const tituloWrap = el("span", { class: "categoria__titulo-wrap" }, [
      el("span", { text: categoria.nombre }),
    ]);

    const meta = el("span", { class: "categoria__meta" }, [
      el("span", { class: "categoria__chevron" }),
    ]);

    details.appendChild(el("summary", {}, [tituloWrap, meta]));

    const body = el("div", { class: "categoria__body" });
    if (total === 0) {
      body.appendChild(el("p", {
        class: "categoria__vacio",
        text: "Próximamente.",
      }));
    } else {
      categoria.items.forEach((it) => body.appendChild(renderItem(it)));
    }
    details.appendChild(body);
    return details;
  }

  function renderAgenda(categorias) {
    contenedor.innerHTML = "";
    categorias.forEach((categoria, i) => {
      contenedor.appendChild(renderCategoria(categoria, CATEGORY_COLORS[i % CATEGORY_COLORS.length]));
    });

    // Al abrir una categoría, cierra las demás.
    const categoriasEl = contenedor.querySelectorAll(".categoria");
    categoriasEl.forEach((cat) => {
      cat.addEventListener("toggle", () => {
        if (!cat.open) return;
        categoriasEl.forEach((otra) => {
          if (otra !== cat) otra.open = false;
        });
      });
    });
  }

  contenedor.innerHTML = '<p class="categoria__vacio">Cargando agenda…</p>';

  fetch(SHEET_CSV_URL)
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then((csv) => {
      const resultado = Papa.parse(csv, { header: true, skipEmptyLines: true });
      renderAgenda(agruparFilas(resultado.data));
    })
    .catch((err) => {
      console.error("No se pudo cargar la agenda desde Sheets:", err);
      contenedor.innerHTML =
        '<p class="categoria__vacio">No se pudo cargar la agenda en este momento. Probá recargar la página en un rato.</p>';
    });
})();
</script>
