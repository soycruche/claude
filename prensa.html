<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function () {
  const contenedor = document.getElementById("prensa-contenido");

  // Las notas se cargan en la pestaña "Prensa" de la misma planilla de la
  // agenda, con las columnas: titulo, link, imagen (la imagen es opcional).
  // Planilla: https://docs.google.com/spreadsheets/d/1oLdtQzdmme7pPJ-NBG_-6BhbpjC6SOH_eI6HRoOpJtk/edit
  const PESTANIA = "Prensa";
  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/1oLdtQzdmme7pPJ-NBG_-6BhbpjC6SOH_eI6HRoOpJtk/gviz/tq?tqx=out:csv&headers=1&sheet=" +
    encodeURIComponent(PESTANIA);

  // Colores del festival para las notas que todavía no tienen foto.
  const COLORES = ["#F8991B", "#48B9E3", "#005BAA", "#E6C420", "#7A8B3C", "#3C8577", "#7A4870", "#9C3F55", "#EA3524", "#B97A2B"];

  // Encabezados sin tildes ni mayúsculas, y "foto" vale como "imagen".
  function clave(encabezado) {
    const k = (encabezado || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
    return k === "foto" ? "imagen" : k;
  }

  // Un link de Google Drive ("Compartir" > "Copiar vínculo") se convierte
  // en la imagen directa; cualquier otra URL de imagen se usa tal cual.
  function urlImagen(texto) {
    const url = (texto || "").trim();
    if (!url) return "";
    const drive = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
    if (drive) return "https://drive.google.com/thumbnail?id=" + drive[1] + "&sz=w1200";
    return url;
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    });
    (children || []).forEach((c) => c && node.appendChild(c));
    return node;
  }

  function sinFoto(media, color) {
    media.classList.add("nota__media--vacia");
    media.style.background = color;
    media.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2V5zm13 4h3v8a2 2 0 0 1-2 2h-1M7 9h7M7 12h7M7 15h4"/></svg>';
  }

  function renderNota(nota, i) {
    const color = COLORES[i % COLORES.length];
    const media = el("span", { class: "nota__media" });
    const imagen = urlImagen(nota.imagen);
    if (imagen) {
      const img = el("img", { src: imagen, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
      img.addEventListener("error", () => sinFoto(media, color));
      media.appendChild(img);
    } else {
      sinFoto(media, color);
    }
    const texto = el("span", { class: "nota__texto" }, [
      el("span", { class: "nota__titulo", text: nota.titulo }),
      el("span", { class: "nota__leer", text: "Leer nota" }),
    ]);
    return el("a", { class: "nota", href: nota.link, target: "_blank", rel: "noopener" }, [media, texto]);
  }

  contenedor.innerHTML = '<p class="categoria__vacio">Cargando notas…</p>';

  fetch(SHEET_CSV_URL)
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then((csv) => {
      const filas = Papa.parse(csv, { header: true, skipEmptyLines: true, transformHeader: clave }).data;
      const notas = filas
        .map((f) => ({ titulo: (f.titulo || "").trim(), link: (f.link || "").trim(), imagen: f.imagen }))
        .filter((n) => n.titulo && /^https?:\/\//i.test(n.link));
      contenedor.innerHTML = "";
      if (!notas.length) {
        contenedor.innerHTML = '<p class="categoria__vacio">Próximamente.</p>';
        return;
      }
      notas.forEach((nota, i) => contenedor.appendChild(renderNota(nota, i)));
    })
    .catch((err) => {
      console.error("No se pudieron cargar las notas desde Sheets:", err);
      contenedor.innerHTML =
        '<p class="categoria__vacio">No se pudieron cargar las notas en este momento. Probá recargar la página en un rato.</p>';
    });
})();
</script>
